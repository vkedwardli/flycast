# gdxsv: temporary standalone Windows HTTPS latency comparison only.
name: Windows latency diagnostics

on:
  push:
    branches:
      - 'temp/windows-latency-headers'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latency:
    name: Windows four-way latency probe
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: 'msys2 {0}'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: git mingw-w64-x86_64-gcc mingw-w64-x86_64-python
      - name: Build and run all four variants in all enabled regions
        run: >-
          python gdxsv_tests/rollback/windows_https_latency.py
          --baseline 18d3e802cd1e86fd3f380ce6ab9d90f573576728
      - name: Add table to job summary
        if: always()
        shell: bash
        run: |
          if [ -f build/windows-https-latency/summary.md ]; then
            cat build/windows-https-latency/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save standalone probe and console log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-https-latency
          path: |
            build/windows-https-latency/windows-https-latency.exe
            build/windows-https-latency/run-latency.cmd
            build/windows-https-latency/latency.log
            build/windows-https-latency/summary.md
