# gdxsv: standalone Windows latency probe; application build is opt-in.
name: Windows latency diagnostics

on:
  push:
    branches:
      - 'temp/windows-latency-headers'
  workflow_dispatch:
    inputs:
      build_flycast:
        description: Build the Windows application instead of running the standalone probe
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  latency:
    name: Windows four-way latency probe
    if: github.event_name != 'workflow_dispatch' || !inputs.build_flycast
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: 'msys2 {0}'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: git mingw-w64-x86_64-gcc mingw-w64-x86_64-python
      - name: Build and run all four variants in all enabled regions
        run: >-
          python gdxsv_tests/rollback/windows_https_latency.py
          --baseline 18d3e802cd1e86fd3f380ce6ab9d90f573576728
      - name: Add table to job summary
        if: always()
        shell: bash
        run: |
          if [ -f build/windows-https-latency/summary.md ]; then
            cat build/windows-https-latency/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save standalone probe and console log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-https-latency
          path: |
            build/windows-https-latency/windows-https-latency.exe
            build/windows-https-latency/run-latency.cmd
            build/windows-https-latency/latency.log
            build/windows-https-latency/summary.md

  build:
    name: Windows Flycast
    if: github.event_name == 'workflow_dispatch' && inputs.build_flycast
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: 'msys2 {0}'
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: git make mingw-w64-x86_64-ccache mingw-w64-x86_64-cmake mingw-w64-x86_64-lua mingw-w64-x86_64-ninja mingw-w64-x86_64-SDL2 mingw-w64-x86_64-toolchain mingw-w64-x86_64-libcdio
      - uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-latency-${{ github.sha }}
          restore-keys: |
            ccache-windows-latency-
            ccache-x86_64-w64-mingw32-
      - name: Build Windows application
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=artifact
          cmake --build build --target install
      - name: Package Windows application
        run: |
          mv artifact/bin/flycast.exe artifact/bin/flycast-gdxsv.exe
          strip artifact/bin/flycast-gdxsv.exe
          powershell Compress-Archive artifact/bin/flycast-gdxsv.exe artifact/bin/flycast-gdxsv-windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: flycast-windows-latency
          path: artifact/bin/flycast-gdxsv-windows.zip
