name: Nintendo Switch

on:
  push:
    branches-ignore:
      - 'l10n_**'
  pull_request:

jobs:
  build:
    name: Switch ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    strategy:
      matrix:
        config:
          # - {name: standalone, destDir: switch}
          - {
              name: standalone-debug,
              destDir: switch-debug,
              buildType: Debug,
              cFlags: "-O0 -g3 -ggdb -fno-omit-frame-pointer",
              cxxFlags: "-O0 -g3 -ggdb -fno-omit-frame-pointer",
              linkerFlags: "-Wl,--build-id"
            }
          # - {name: libretro, cmakeArgs: -DLIBRETRO=ON}

    steps:
      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get -y install ccache cmake build-essential flex bison texinfo libgmp-dev libmpfr-dev libmpc-dev libisl-dev zlib1g-dev libzstd-dev

      - name: Rebuild Switch toolchain with libstdc++ TLS
        run: |
          set -eux

          CXX="$DEVKITPRO/devkitA64/bin/aarch64-none-elf-g++"
          GCC="$DEVKITPRO/devkitA64/bin/aarch64-none-elf-gcc"
          AR="$DEVKITPRO/devkitA64/bin/aarch64-none-elf-ar"
          NM="$DEVKITPRO/devkitA64/bin/aarch64-none-elf-nm"
          OBJDUMP="$DEVKITPRO/devkitA64/bin/aarch64-none-elf-objdump"
          GCC_VER="$($CXX -dumpfullversion)"
          GCC_SRC="/tmp/devkitpro-gcc"
          GCC_BUILD="/tmp/devkitpro-gcc-build"
          SYSROOT="$DEVKITPRO/devkitA64/aarch64-none-elf"

          git clone --depth 1 --branch "releases/gcc-${GCC_VER}" https://github.com/devkitPro/gcc.git "$GCC_SRC"

          BUILD_TRIPLET="$("$GCC_SRC/config.guess")"

          perl -0pi -e 's/AC_DEFINE\(HAVE_MEMALIGN\)\n/AC_DEFINE(HAVE_MEMALIGN)\n\n    case "\${target}" in\n      aarch64-none-elf*)\n        AC_DEFINE(HAVE_TLS)\n        ;;\n    esac\n/g' "$GCC_SRC/libstdc++-v3/configure.ac"

          perl -0pi -e 's/(\$as_echo "#define HAVE_MEMALIGN 1" >>confdefs\.h\n)/$1\n    case "\${target}" in\n      aarch64-none-elf*)\n        \$as_echo "#define HAVE_TLS 1" >>confdefs.h\n        ;;\n    esac\n/g' "$GCC_SRC/libstdc++-v3/configure"

          perl -0pi -e 's/(      uclinux\*\)\n        ac_has_nanosleep=yes\n        ac_has_sched_yield=yes\n    esac\n)/$1\n    case "\${target}" in\n      aarch64-none-elf*)\n        ac_has_clock_monotonic=yes\n        ac_has_clock_realtime=yes\n        ac_has_nanosleep=yes\n        ac_has_sched_yield=yes\n        ;;\n    esac\n/g' "$GCC_SRC/libstdc++-v3/acinclude.m4"

          perl -0pi -e 's/(      uclinux\*\)\n        ac_has_nanosleep=yes\n        ac_has_sched_yield=yes\n    esac\n)/$1\n    case "\${target}" in\n      aarch64-none-elf*)\n        ac_has_clock_monotonic=yes\n        ac_has_clock_realtime=yes\n        ac_has_nanosleep=yes\n        ac_has_sched_yield=yes\n        ;;\n    esac\n/g' "$GCC_SRC/libstdc++-v3/configure"

          mkdir -p "$GCC_BUILD"
          cd "$GCC_BUILD"

          "$GCC_SRC/configure" \
            --target=aarch64-none-elf \
            --build="$BUILD_TRIPLET" \
            --host="$BUILD_TRIPLET" \
            --prefix="$DEVKITPRO/devkitA64" \
            --enable-languages=c,c++,lto \
            --with-gnu-as \
            --with-gnu-ld \
            --with-gcc \
            --with-march=armv8 \
            --enable-cxx-flags=-ffunction-sections \
            --disable-libstdcxx-verbose \
            --enable-poison-system-directories \
            --enable-multilib \
            --enable-threads \
            --disable-win32-registry \
            --disable-nls \
            --disable-debug \
            --disable-libmudflap \
            --disable-libssp \
            --disable-libgomp \
            --disable-libstdcxx-pch \
            --enable-libstdcxx-filesystem-ts \
            --with-newlib=yes \
            --with-native-system-header-dir=/include \
            --with-sysroot="$SYSROOT" \
            --enable-lto \
            --disable-tm-clone-registry \
            --disable-__cxa_atexit \
            --with-bugurl=https://devkitpro.org \
            --with-pkgversion=devkitA64

          make -j"$(nproc)" all-gcc all-target-libgcc all-target-libstdc++-v3
          make install-gcc install-target-libgcc install-target-libstdc++-v3

          CXXCONFIG="$DEVKITPRO/devkitA64/aarch64-none-elf/include/c++/${GCC_VER}/aarch64-none-elf/pic/bits/c++config.h"
          grep -q '^#define _GLIBCXX_HAVE_TLS 1' "$CXXCONFIG"
          grep -q '^#define _GLIBCXX_USE_CLOCK_MONOTONIC 1' "$CXXCONFIG"
          grep -q '^#define _GLIBCXX_USE_CLOCK_REALTIME 1' "$CXXCONFIG"
          grep -q '^#define _GLIBCXX_USE_NANOSLEEP 1' "$CXXCONFIG"
          grep -q '^#define _GLIBCXX_USE_SCHED_YIELD 1' "$CXXCONFIG"

          mkdir -p /tmp/check-libstdcxx
          cd /tmp/check-libstdcxx
          LIBSTDCPP="$("$CXX" -fPIC -print-file-name=libstdc++.a)"
          "$AR" x "$LIBSTDCPP" eh_globals.o mutex.o
          if "$NM" -A eh_globals.o | grep -E 'pthread_(key_create|get|set)specific|malloc|free'; then
            exit 1
          fi
          "$OBJDUMP" -r eh_globals.o | grep -q TLSLE
          "$NM" -A mutex.o | grep -q '_ZSt15__once_callable'
          "$NM" -A mutex.o | grep -q '_ZSt11__once_call'
          if "$NM" -A mutex.o | grep -q '_ZSt14__once_functor'; then
            exit 1
          fi

          "$CXX" -fPIC -fPIE -specs="$DEVKITPRO/libnx/switch.specs" -x c++ - -o /tmp/check-libstdcxx/throw-test.elf <<'EOF'
          #include <stdexcept>
          int main() {
            try { throw std::runtime_error("tls"); }
            catch (const std::runtime_error&) { return 0; }
            return 1;
          }
          EOF

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Mark git repository as safe
        run: git config --global --add safe.directory $PWD

      - uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-switch-${{ matrix.config.name }}-${{ github.sha }}
          restore-keys: ccache-switch-${{ matrix.config.name }}-

      - name: CMake
        run: |
          set -eux

          BUILD_TYPE="${{ matrix.config.buildType || 'Release' }}"
          BUILD_TYPE_UPPER=$(printf '%s' "$BUILD_TYPE" | tr '[:lower:]' '[:upper:]')
          CMAKE_EXTRA_ARGS="${{ matrix.config.cmakeArgs || '' }}"

          set -- -B build "-DCMAKE_BUILD_TYPE=$BUILD_TYPE" -DCMAKE_INSTALL_PREFIX=artifact -G Ninja
          if [ -n "${{ matrix.config.cFlags || '' }}" ]; then
            set -- "$@" "-DCMAKE_C_FLAGS_${BUILD_TYPE_UPPER}=${{ matrix.config.cFlags }}"
          fi
          if [ -n "${{ matrix.config.cxxFlags || '' }}" ]; then
            set -- "$@" "-DCMAKE_CXX_FLAGS_${BUILD_TYPE_UPPER}=${{ matrix.config.cxxFlags }}"
          fi
          if [ -n "${{ matrix.config.linkerFlags || '' }}" ]; then
            set -- "$@" "-DCMAKE_EXE_LINKER_FLAGS_${BUILD_TYPE_UPPER}=${{ matrix.config.linkerFlags }}"
          fi
          if [ -n "$CMAKE_EXTRA_ARGS" ]; then
            set -- "$@" $CMAKE_EXTRA_ARGS
          fi

          $DEVKITPRO/portlibs/switch/bin/aarch64-none-elf-cmake "$@"
          cmake --build build --config "$BUILD_TYPE" --target install
          if [ -f build/flycast.elf ]; then
            cp build/flycast.elf artifact/bin/flycast.elf
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: flycast-switch-${{ matrix.config.name }}
          path: |
            artifact/bin
            artifact/lib/libretro

      - name: Package app
        run: zip -m artifact/bin/flycast.nro.zip artifact/bin/flycast.nro
        if: hashFiles('artifact/bin/flycast.nro') != ''

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
          version: v1.69.1

      - name: Upload to S3
        run: rclone copy artifact/bin scaleway:flycast-builds/${{ matrix.config.destDir }}/${GITHUB_REF#refs/}-$GITHUB_SHA
        if: github.repository == 'flyinghead/flycast' && github.event_name == 'push' && matrix.config.destDir != ''
