name: Nintendo Switch

on:
  push:
    branches-ignore:
      - 'l10n_**'
  pull_request:

jobs:
  build:
    name: Switch ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    strategy:
      matrix:
        config:
          # - {name: standalone, destDir: switch}
          - {
              name: standalone-debug,
              destDir: switch-debug,
              buildType: Debug,
              cFlags: "-O0 -g3 -ggdb -fno-omit-frame-pointer",
              cxxFlags: "-O0 -g3 -ggdb -fno-omit-frame-pointer",
              linkerFlags: "-Wl,--build-id"
            }
          # - {name: libretro, cmakeArgs: -DLIBRETRO=ON}

    steps:
      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get -y install ccache cmake

      - name: Patch Switch libstdc++ TLS objects
        run: |
          set -eux

          CXX="$DEVKITPRO/devkitA64/bin/aarch64-none-elf-g++"
          AR="$DEVKITPRO/devkitA64/bin/aarch64-none-elf-ar"
          RANLIB="$DEVKITPRO/devkitA64/bin/aarch64-none-elf-ranlib"
          NM="$DEVKITPRO/devkitA64/bin/aarch64-none-elf-nm"
          OBJDUMP="$DEVKITPRO/devkitA64/bin/aarch64-none-elf-objdump"
          GCC_VER="$($CXX -dumpfullversion)"
          GCC_SRC="/tmp/devkitpro-gcc"

          git clone --depth 1 --branch "releases/gcc-${GCC_VER}" https://github.com/devkitPro/gcc.git "$GCC_SRC"

          "$CXX" -c -fPIC -mtp=soft -ftls-model=local-exec -O2 -std=gnu++17 \
            -D_GLIBCXX_HAVE_TLS=1 \
            -o /tmp/eh_globals.o \
            "$GCC_SRC/libstdc++-v3/libsupc++/eh_globals.cc"

          "$CXX" -c -fPIC -mtp=soft -ftls-model=local-exec -O2 -std=gnu++17 \
            -D_GLIBCXX_HAVE_TLS=1 \
            -o /tmp/mutex.o \
            "$GCC_SRC/libstdc++-v3/src/c++11/mutex.cc"

          LIBSTDCPP="$("$CXX" -fPIC -print-file-name=libstdc++.a)"
          "$AR" r "$LIBSTDCPP" /tmp/eh_globals.o /tmp/mutex.o
          "$RANLIB" "$LIBSTDCPP"

          CXXCONFIG="$DEVKITPRO/devkitA64/aarch64-none-elf/include/c++/${GCC_VER}/aarch64-none-elf/pic/bits/c++config.h"
          sed -i 's|/\* #undef _GLIBCXX_HAVE_TLS \*/|#define _GLIBCXX_HAVE_TLS 1|' "$CXXCONFIG"
          grep -q '^#define _GLIBCXX_HAVE_TLS 1' "$CXXCONFIG"

          GTHR="$DEVKITPRO/devkitA64/aarch64-none-elf/include/c++/${GCC_VER}/aarch64-none-elf/pic/bits/gthr-default.h"
          perl -0pi -e 's/__GTHREAD_INLINE int\n__gthread_once \(__gthread_once_t \*__once, void \(\*__func\) \(void\)\)\n\{\n  if \(__gthread_active_p \(\)\)\n    return __gthrw_\(pthread_once\) \(__once, __func\);\n  else\n    return -1;\n\}/__GTHREAD_INLINE int\n__gthread_once (__gthread_once_t *__once, void (*__func) (void))\n{\n  if (!__gthread_active_p ())\n    return -1;\n\n  int *__status = &__once->status;\n  int __expected = 0;\n\n  if (__atomic_load_n (__status, __ATOMIC_ACQUIRE) == 2)\n    return 0;\n\n  if (__atomic_compare_exchange_n (__status, &__expected, 1, false,\n                                   __ATOMIC_ACQ_REL, __ATOMIC_ACQUIRE))\n    {\n#ifdef __EXCEPTIONS\n      try\n        {\n          __func ();\n          __atomic_store_n (__status, 2, __ATOMIC_RELEASE);\n        }\n      catch (...)\n        {\n          __atomic_store_n (__status, 0, __ATOMIC_RELEASE);\n          throw;\n        }\n#else\n      __func ();\n      __atomic_store_n (__status, 2, __ATOMIC_RELEASE);\n#endif\n      return 0;\n    }\n\n  while (__atomic_load_n (__status, __ATOMIC_ACQUIRE) != 2)\n    __gthread_yield ();\n\n  return 0;\n}/s' "$GTHR"
          grep -q '__atomic_compare_exchange_n' "$GTHR"

          mkdir -p /tmp/check-libstdcxx
          cd /tmp/check-libstdcxx
          "$AR" x "$LIBSTDCPP" eh_globals.o mutex.o
          if "$NM" -A eh_globals.o | grep -E 'pthread_(key_create|get|set)specific|malloc|free'; then
            exit 1
          fi
          "$NM" -A eh_globals.o | grep -q ' U __aarch64_read_tp'
          if "$OBJDUMP" -d eh_globals.o | grep -q 'mrs.*tpidr_el0'; then
            exit 1
          fi
          "$OBJDUMP" -r eh_globals.o | grep -q TLSLE
          "$NM" -A mutex.o | grep -q '_ZSt15__once_callable'
          "$NM" -A mutex.o | grep -q '_ZSt11__once_call'
          if "$NM" -A mutex.o | grep -q '_ZSt14__once_functor'; then
            exit 1
          fi
          "$OBJDUMP" -r mutex.o | grep -q TLSLE

          "$CXX" -c -fPIC -mtp=soft -ftls-model=local-exec -O2 -std=gnu++17 -x c++ - -o /tmp/check-libstdcxx/throw-test.o <<'EOF'
          #include <stdexcept>
          #include <mutex>
          int main() {
            std::once_flag flag;
            std::call_once(flag, [] {});
            try { throw std::runtime_error("tls"); }
            catch (const std::runtime_error&) { return 0; }
            return 1;
          }
          EOF

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Mark git repository as safe
        run: git config --global --add safe.directory $PWD

      - uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-switch-${{ matrix.config.name }}-${{ github.sha }}
          restore-keys: ccache-switch-${{ matrix.config.name }}-

      - name: CMake
        run: |
          set -eux

          BUILD_TYPE="${{ matrix.config.buildType || 'Release' }}"
          BUILD_TYPE_UPPER=$(printf '%s' "$BUILD_TYPE" | tr '[:lower:]' '[:upper:]')
          CMAKE_EXTRA_ARGS="${{ matrix.config.cmakeArgs || '' }}"

          set -- -B build "-DCMAKE_BUILD_TYPE=$BUILD_TYPE" -DCMAKE_INSTALL_PREFIX=artifact -G Ninja
          if [ -n "${{ matrix.config.cFlags || '' }}" ]; then
            set -- "$@" "-DCMAKE_C_FLAGS_${BUILD_TYPE_UPPER}=${{ matrix.config.cFlags }}"
          fi
          if [ -n "${{ matrix.config.cxxFlags || '' }}" ]; then
            set -- "$@" "-DCMAKE_CXX_FLAGS_${BUILD_TYPE_UPPER}=${{ matrix.config.cxxFlags }}"
          fi
          if [ -n "${{ matrix.config.linkerFlags || '' }}" ]; then
            set -- "$@" "-DCMAKE_EXE_LINKER_FLAGS_${BUILD_TYPE_UPPER}=${{ matrix.config.linkerFlags }}"
          fi
          if [ -n "$CMAKE_EXTRA_ARGS" ]; then
            set -- "$@" $CMAKE_EXTRA_ARGS
          fi

          $DEVKITPRO/portlibs/switch/bin/aarch64-none-elf-cmake "$@"
          cmake --build build --config "$BUILD_TYPE" --target install
          if [ -f build/flycast.elf ]; then
            cp build/flycast.elf artifact/bin/flycast.elf
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: flycast-switch-${{ matrix.config.name }}
          path: |
            artifact/bin
            artifact/lib/libretro

      - name: Package app
        run: zip -m artifact/bin/flycast.nro.zip artifact/bin/flycast.nro
        if: hashFiles('artifact/bin/flycast.nro') != ''

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
          version: v1.69.1

      - name: Upload to S3
        run: rclone copy artifact/bin scaleway:flycast-builds/${{ matrix.config.destDir }}/${GITHUB_REF#refs/}-$GITHUB_SHA
        if: github.repository == 'flyinghead/flycast' && github.event_name == 'push' && matrix.config.destDir != ''
